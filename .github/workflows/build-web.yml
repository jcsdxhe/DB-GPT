name: Isolated pr3278 scope validation

# Validation wrapper only; this workflow change is excluded from the PR candidate.
on:
  push:
    branches: [codex/pr3278-scope-ci-20261011]

permissions:
  contents: read

defaults:
  run:
    working-directory: ./web

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 827092cb353d2d7e00efdd5a051ba72b7be60b1b
      - name: Verify the exact candidate commit
        run: |
          test "$(git rev-parse HEAD)" = "827092cb353d2d7e00efdd5a051ba72b7be60b1b"
          git rev-parse HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
      - name: Pin npm used by the lockfile
        run: npm install --global npm@10.8.2
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Existing unit tests
        run: npm test
      - name: Build contract tests
        run: npm run test:build
      - name: Dashboard component tests
        run: npm run test:dashboard
      - name: Production build
        run: npm run build
      - name: Static export
        run: npm run export
